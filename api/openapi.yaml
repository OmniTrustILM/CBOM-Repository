openapi: 3.1.1
info:
  title: CBOM-Repository Service API
  description: |-
    REST API for uploading, retrieving and searching of cryptographic software bill of materials documents.
    A cryptographic software bill of materials document adheres to CycloneDX schema version 1.6 or 1.7.

  contact:
    name: ILM
    url: https://www.omnitrust.com
    email: ilm@omnitrust.com

  license:
    name: Apache License, Version 2.0
    url: https://github.com/OmniTrustILM/cbom-repository/blob/main/LICENSE.md
  version: 0.3.0

externalDocs:
  description: ILM Documentation
  url: https://docs.otilm.com

paths:
  /v1/bom:
    post:
      summary: Upload a BOM
      operationId: uploadBOM
      requestBody:
        required: true
        description: >-
          CycloneDX BOM document. The schema version may be declared via the
          media-type `version` parameter, e.g.
          `application/vnd.cyclonedx+json; version=1.7` (supported: 1.6, 1.7); when
          declared, the document's own `specVersion` must match it. When the
          parameter is omitted, the server auto-detects the version from the
          document's `specVersion`. An unsupported version (declared or detected)
          is rejected with 400.
        content:
           application/vnd.cyclonedx+json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: string
              format: binary

      responses:
        '201':
          description: BOM created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOMCreateResponse'
        '400':
          description: Bad Request (e.g. malformed BOM, or unsupported/mismatched CycloneDX version)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict (e.g. BOM with same serialNumber/version already exists)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: >-
            Unsupported media type: the `Content-Type` is missing/blank, cannot be
            parsed, or its base type is not `application/vnd.cyclonedx+json`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: General Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      summary: Search BOMs created after a timestamp, paged with a cursor
      description: |-
        Lists BOM documents whose creation time (the object store's `LastModified`) is
        strictly after a position given by exactly one of `after` (a Unix timestamp) or
        `cursor` (an opaque continuation token from the previous page's `Link` header).
        Three modes:

        **Unpaged (no `limit`)** — the original behaviour, unchanged byte for byte:
        every matching document, in object-store listing order (key order), compared at
        the store's full timestamp precision; documents without statistics metadata are
        skipped, one with unreadable statistics metadata fails the call, and `warnings`
        is never emitted. No `Link` header is ever sent.

        **Paged, `after` + `limit` (opens a run)** — the body is unchanged from the
        earlier paged behaviour (byte for byte on every store whose listing stamps are at
        most millisecond-precise, which is every known S3 implementation): entries are
        ordered by the store's `LastModified` at millisecond precision (the finest an S3
        listing carries, and the precision the cursor records), then by object key, and
        the comparison with `after` is done in whole seconds (the precision of
        `created_at`).
        `created_at` is derived from that same listing timestamp, so advancing `after`
        by it is always safe. While more entries remain, a page holds at least `limit`
        entries and is then extended with every further entry that shares the last
        entry's second, so a page never splits a second: the limit is soft, the page
        size is `max(limit, entries in that second)`, and `limit` bounds the per-call
        fan-out only while seconds are sparse. When the page stopped before the end of
        the listing, the response carries a `Link` header with `rel="next"` (see below);
        when it examined everything the header is absent and the run is complete.

        **Paged, `cursor` + `limit` (continues a run)** — the page holds exactly `limit`
        entries while candidates remain, fewer (possibly zero) on the last page: the
        limit is hard, no second-completion. Candidates are the listed objects whose
        pair `(LastModified, key)` is strictly greater than the cursor's pair, ordered
        by `(LastModified asc, key asc)`. Comparison and ordering are at millisecond
        granularity (the finest precision an S3 listing carries: seconds on AWS S3,
        milliseconds on MinIO) with the object key as tie-break, so page boundaries are
        exact and unique. `Link` with `rel="next"` is present when the page stopped
        before the end of the listing and absent when it examined everything.
        `created_at` is derived from the listing `LastModified` (second precision), as on
        the `after` page.

        In both paged modes, objects whose key does not follow the `<urn>-<version>`
        naming (possible only for objects written to the bucket outside this API) or
        whose version suffix is not a positive integer or `original`, and objects that
        vanish between the listing and their `HEAD`, are skipped with a warning in the
        service log; skipped candidates do not count toward `limit`. (A key with no `-`
        at all also fails the unpaged call, while a key whose version suffix is not a
        positive integer or `original` is returned as-is by the unpaged call.) A page
        shorter than `limit` (including an empty one) is the last page in both modes;
        the converse is not guaranteed (a `cursor` page of exactly `limit` entries may
        be the last one), so the absence of `Link`, not the page size, says the run is
        complete. A `Link` can lead to an empty last page when the remaining listed
        objects are skipped or have vanished.

        The cursor token is opaque: echo it back unchanged, never construct or modify
        it. The server encodes `v1|<LastModified in Unix milliseconds>|<key>` of the
        page's last entry — the listing's timestamp, not the `HEAD` one — as
        base64url without padding; the key comes last so a `|` inside a key cannot
        break parsing. A cursor is valid within a run only — do not persist it across
        runs or across a store migration; between runs use the watermark rule below.

        The `Link` header (RFC 8288) is a relative-path reference to this resource, never
        an absolute URL: `Link: <bom?cursor=<token>&limit=<N>>; rel="next"`. Resolve it
        against the URL you just requested (RFC 3986 §5.2 — `URI.resolve` in Java,
        `URL.ResolveReference` in Go, `urljoin` in Python): the result is your own URL
        for this operation — with whatever prefix the deployment mounts the API under
        (`/api` by default), and with any prefix an ingress strips before the request
        reaches the service — plus the query `cursor=<token>&limit=<N>`. Scheme and host
        are not guessed behind proxies, and the service's own path is not repeated (it
        would be wrong exactly when a prefix was stripped). A client that builds URLs
        from a configured base can equally append the target's query string to its own
        URL for this operation — which is also the way through a proxy that rewrites the
        last path segment, since the reference relies on what the documented paths
        guarantee: your URL ends in the `bom` segment, without a trailing slash. The
        body stays a JSON array of `BOMEntry`; there is no envelope.

        Client protocol (recommended):

        1. note the run start time (your clock, or the `Date` header of the first response)
        2. `GET /v1/bom?after={watermark}&limit=N`
        3. process the page — deduplicate on `(serialNumber, version)`
        4. if the response carries a `Link` header with `rel="next"`, resolve its target
           against the URL you requested and `GET` it (your `/v1/bom` URL with
           `?cursor=...&limit=N`, same `N`), then repeat from 3; otherwise stop
        5. within the run every object that was listable when its page was built is
           yielded exactly once; an object overwritten during the run moves to a new
           `(LastModified, key)` position and is yielded again under its new stamp if
           that position is still ahead of the run, otherwise the next run picks it up
           — at-least-once, exactly-once for objects not modified during the run
        6. persist `watermark = run start − overlap` for the next run. The overlap must
           cover clock skew between you and the object store, plus the longest upload
           you expect, plus 1 s for the still-open second: S3 stamps a multipart upload
           with its *initiation* time, so an object can become visible with a
           `created_at` behind a page boundary you already passed. Do **not** derive the
           watermark from the last `created_at` or from a cursor. Core uses 60 s. The
           overlap is the client's; the server has no overlap parameter. Re-reading
           across runs is expected; duplicates are the consumer's to drop.
        7. a run that fails — any non-2xx response, including a 400 from a replica that
           does not know `cursor` yet during a rolling upgrade — must not advance the
           watermark; retry the whole run from `after`

        The earlier protocol — advancing `after` by the last entry's `created_at` and
        stopping on a page shorter than `limit` — keeps working unchanged for consumers
        that do not follow `Link`; following `Link` is recommended because pages are
        then exactly `limit` and boundaries are exact.

        Every call lists the whole bucket — the store cannot filter by time — so paging
        bounds the per-call fan-out and response size, not the listing cost.

        In both paged modes, documents whose stored statistics are missing or unreadable
        are returned with `cryptoStats: null` and a `warnings` code instead of being
        omitted, and two further codes flag valid statistics that are shallow (stored
        before nested components were counted) or truncated (document deeper than the
        1000-level counting bound). See `StatsWarning`.

        Requests are rejected with 400 (`application/problem+json`) when `cursor` is
        given without `limit`; when `cursor` and `after` are combined (a run opens with
        `after` and continues with `cursor`); when `cursor` is malformed — not
        base64url, wrong version tag, missing fields, non-numeric or negative timestamp,
        empty key, empty value, or otherwise not canonical; when `cursor` is given more
        than once; when any query parameter cannot be decoded — invalid percent-encoding,
        or a `;` where `&` is expected (the parameter is named in the problem detail);
        when `limit` is outside 1..1000 (rejected, not clamped); or when, without
        `cursor`, `after` is missing or not a non-negative integer.
      operationId: getBOMs
      parameters:
        - name: after
          in: query
          description: >-
            Unix timestamp (seconds). Only documents created strictly after it are
            returned. Required unless `cursor` is given; cannot be combined with
            `cursor` (a run opens with `after` and continues with `cursor`). Exactly
            one of `after` and `cursor` must be present.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          description: >-
            Page size (paged mode). Absent means the unpaged legacy behaviour; required
            when `cursor` is given. Must be between 1 and 1000; values outside that
            range are rejected with 400, not clamped. Soft on the `after` page, where
            the response may contain more than `limit` entries when the last second is
            completed (see the operation description); hard on `cursor` pages, which
            hold exactly `limit` entries while candidates remain.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: >-
            Opaque continuation token copied from the previous response's `Link`
            header (`rel="next"`). Requires `limit`; cannot be combined with `after`.
            Valid within a run only, so do not persist it across runs or across a store
            migration. Echo it back unchanged; a token not in the canonical form the
            service issues is rejected with 400 (it is a position, not a credential:
            it is not signed).
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Array of BOM entries, one per stored document version (`original` included).
          headers:
            Link:
              description: >-
                Paged modes only (`after` + `limit` and `cursor` + `limit`); never sent
                by the unpaged call. Present when this page stopped before the end of
                the listing (the next page can still be empty), absent when it examined
                everything — the run is complete. An RFC 8288 link with `rel="next"`
                whose target is a relative-path reference to this resource
                (`bom?cursor=<token>&limit=<N>`, same `N`): resolve it against the
                request URL (RFC 3986) to get your own URL for this operation with the
                continuation query. The token is opaque and valid within the run only.
              schema:
                type: string
              example: '<bom?cursor=djF8MTc4ODQ1MTIwMDAwMHx1cm46dXVpZDozZTY3MTY4Ny0zOTViLTQxZjUtYTMwZi1hNTg5MjFhNjliNzktMQ&limit=100>; rel="next"'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BOMEntry'
        "400":
          description: >-
            Bad Request: `after` missing (when `cursor` is absent) or not a non-negative
            integer; `limit` outside 1..1000; `cursor` without `limit`; `cursor` combined
            with `after`; `cursor` given more than once; a query parameter that cannot be
            decoded; or a malformed `cursor` (not base64url, wrong version
            tag, missing fields, non-numeric or negative timestamp, empty key, empty
            value, or otherwise not in the canonical form the service issues).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: General Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/bom/{urn}:
    get:
      summary: Retrieve a BOM by URN
      operationId: getBOMByUrn
      parameters:
        - name: urn
          in: path
          description: Unique resource identifier (URN), corresponds to CycloneDX serial number.
          required: true
          schema:
            type: string
            example: "urn:uuid:3e671687-395b-41f5-a30f-a58921a69b79"
        - name: version
          in: query
          description: >-
            Optional document version: a decimal integer without leading zeros, or the
            literal `original` (the unmodified upload stored when the service assigned
            the serial number). Any other non-empty value is rejected with 400. If
            omitted, empty or whitespace-only, the highest numbered version is returned.
          required: false
          schema:
            type: string
            example: "1"
      responses:
        '200':
          description: Requested BOM
          content:
            application/vnd.cyclonedx+json:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid URN in the path, or `version` is neither a positive integer nor `original`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: BOM not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          description: General Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/bom/{urn}/versions:
    get:
      summary: List available BOM versions
      description: Returns all available versions of a BOM identified by its URN.
      operationId: listBomVersions
      tags:
        - BOM
      parameters:
        - name: urn
          in: path
          required: true
          description: URN of the BOM
          schema:
            type: string
      responses:
        '200':
          description: Successful response with list of BOM versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BOMVersion'
        '400':
          description: Invalid URN supplied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: BOM not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/health:
    get:
      summary: Get overall health status
      operationId: getHealth
      description: |-
        Returns the health status of the service and its components.
        Status codes: 200 (UP/DEGRADED), 503 (DOWN/OUT_OF_SERVICE)
      responses:
        '200':
          description: Service is healthy or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is down or out of service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/health/liveness:
    get:
      summary: Kubernetes liveness probe
      operationId: getLiveness
      description: |-
        Returns liveness status. Used by Kubernetes to determine if the pod should be restarted.
        Always returns UP unless the process itself is in a failed state.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is not alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/health/readiness:
    get:
      summary: Kubernetes readiness probe
      operationId: getReadiness
      description: |-
        Returns readiness status. Used by Kubernetes to determine if the pod can accept traffic.
        Returns OUT_OF_SERVICE if critical components (e.g., storage) are unavailable.
      responses:
        '200':
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is not ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:

    HealthResponse:
      type: object
      description: Health status response
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN, DEGRADED]
          description: Overall health status
          example: "UP"
        components:
          type: object
          description: Status of individual components
          additionalProperties:
            $ref: '#/components/schemas/HealthComponent'
          example:
            liveness:
              status: "UP"
            readiness:
              status: "UP"
            storage:
              status: "UP"
              details:
                latencyMs: 45
      required: [status, components]

    HealthComponent:
      type: object
      description: Health status of a single component
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN, DEGRADED]
          description: Component health status
          example: "UP"
        details:
          type: object
          description: Additional details about the component's health
          additionalProperties: true
          example:
            latencyMs: 45
            endpoint: "https://storage.example.com"
      required: [status]

    BOMEntry:
      type: object
      required:
        - serialNumber
        - version
        - created_at
        - cryptoStats
      properties:
        serialNumber:
          type: string
          description: BOM serial number
          example: "urn:uuid:3e671687-395b-41f5-a30f-a58921a69b79"
        version:
          type: string
          description: >-
            Document version — a decimal integer, or the literal `original`. Paged mode
            (`limit`) returns only entries whose stored key carries such a version; the
            unpaged call returns whatever suffix the stored key has.
          example: "1"
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp (UTC, second precision) when this document version was stored.
          example: "2026-01-25T21:35:05Z"
        cryptoStats:
          description: >-
            Cryptographic asset statistics. Never null in the unpaged call; in paged
            mode null when they could not be read (see `warnings`).
          anyOf:
            - $ref: '#/components/schemas/CryptoStats'
            - type: "null"
        warnings:
          type: array
          description: >-
            Paged mode only; present when something about the entry needs the
            consumer's attention. `crypto-stats-missing`: the stored object carries no
            statistics metadata; `crypto-stats-invalid`: the statistics metadata is not
            valid JSON — in both cases `cryptoStats` is null and the document itself is
            still retrievable. `crypto-stats-shallow`: the object was stored before
            nested components were counted, so the (valid) counts cover the top-level
            `components` array only. `crypto-stats-truncated`: the document nests deeper
            than 1000 levels and the counts stop there. Order: missing or invalid first,
            then shallow, then truncated.
          items:
            $ref: '#/components/schemas/StatsWarning'

    StatsWarning:
      type: string
      enum:
        - crypto-stats-missing
        - crypto-stats-invalid
        - crypto-stats-shallow
        - crypto-stats-truncated

    BOMCreateResponse:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      description: Response returned after uploading a BOM.
      properties:
        serialNumber:
          type: string
          description: CycloneDX serial number (URN, RFC-4122).
          example: "urn:uuid:3e671687-395b-41f5-a30f-a58921a69b79"
        version:
          type: integer
          description: CycloneDX integer version number for the BOM document
          example: 1
        cryptoStats:
          $ref: '#/components/schemas/CryptoStats'
      required: [serialNumber, version, cryptoStats]
      additionalProperties: false

    BOMVersion:
      type: object
      required:
        - version
        - created_at
        - cryptoStats
      properties:
        version:
          type: string
          description: Document version — a decimal integer, or the literal `original`.
          example: "1"
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp (UTC, second precision) when this document version was stored.
          example: "2026-01-19T21:35:05Z"
        cryptoStats:
          $ref: '#/components/schemas/CryptoStats'

    # RFC 9457 Problem Details (JSON only)
    ProblemDetails:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      description: Problem Details per RFC 9457 (application/problem+json).
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference that identifies the problem type. Defaults to "about:blank".
          example: "https://example.com/problems/invalid-payload"
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: "Invalid payload"
        status:
          type: integer
          description: HTTP status code for this occurrence of the problem.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: "The 'serialNumber' field is missing."
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem.
          example: "urn:uuid:4b96f3f7-0c2a-43f7-9c0a-7b0b6a3e2a61"
      additionalProperties: true

    CryptoStats:
      type: object
      required:
        - cryptoAssets
      properties:
        cryptoAssets:
          $ref: '#/components/schemas/CryptoAssets'

    CryptoAssets:
      type: object
      description: >-
        Counts of components of type `cryptographic-asset` by `cryptoProperties.assetType`.
        The whole `components` tree is counted (nested components included); documents
        stored before that fix carry a shallow count of the top-level array only. The
        stored object's S3 user metadata `crypto-stats-version` is `2` for tree counts and
        absent for legacy shallow counts.
      required:
        - total
        - algorithms
        - certificates
        - protocols
        - relatedCryptoMaterials
      properties:
        total:
          type: integer
          example: 1
        algorithms:
          $ref: '#/components/schemas/CryptoAssetCount'
        certificates:
          $ref: '#/components/schemas/CryptoAssetCount'
        protocols:
          $ref: '#/components/schemas/CryptoAssetCount'
        relatedCryptoMaterials:
          $ref: '#/components/schemas/CryptoAssetCount'

    CryptoAssetCount:
      type: object
      required:
        - total
      properties:
        total:
          type: integer
          example: 0
